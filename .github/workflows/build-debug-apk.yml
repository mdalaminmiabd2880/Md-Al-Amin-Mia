name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Installable Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and environment file
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output and prepare named APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Byaktigato-Totthyo.apk
          ls -lh Byaktigato-Totthyo.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Byaktigato-Totthyo-apk
          path: Byaktigato-Totthyo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-${GITHUB_RUN_NUMBER}-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" Byaktigato-Totthyo.apk \
            --title "ব্যক্তিগত তথ্য Debug APK (#${GITHUB_RUN_NUMBER})" \
            --notes "সরাসরি ডাউনলোড করে Android ফোনে ইনস্টল করার জন্য Byaktigato-Totthyo.apk।" \
            --latest
